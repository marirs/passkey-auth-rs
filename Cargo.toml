[package]
name        = "passkey-auth"
version     = "0.1.3"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
description = "Pure-Rust WebAuthn server library focused on passkeys (no openssl)."
repository  = "https://github.com/marirs/passkey-auth-rs"
readme      = "README.md"
keywords    = ["webauthn", "passkey", "fido2", "authentication"]
categories  = ["authentication", "cryptography"]
authors     = ["Sriram <marirs@gmail.com>"]

[lib]
name = "passkey_auth"
path = "src/lib.rs"

[dependencies]
# Crypto, all rustcrypto / pure-Rust. No openssl anywhere in the tree.
p256          = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
sha2          = "0.10"
rand          = "0.8"

# CBOR for COSE keys + attestationObject.
ciborium      = "0.2"

# Base64URL for credential IDs, challenges, raw byte fields on the wire.
base64        = "0.22"

# JSON for clientDataJSON parsing.
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# Error type.
thiserror     = "2"

# URL parsing for origin checks.
url           = "2"

# X.509 parsing for the `packed` (with x5c) and `fido-u2f` attestation
# formats. Pure-Rust, RustCrypto family - no openssl. We extract the
# leaf cert's SubjectPublicKey and any AAGUID extension; we do NOT
# validate the chain (see README scope note).
x509-cert     = { version = "0.2", features = ["std"] }
const-oid     = "0.9"

# On wasm32-unknown-unknown (e.g. Cloudflare Workers) std has no wall clock,
# so now_secs() reads the JS Date API instead of std::time::SystemTime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
# Known-vector regression tests live under tests/.
hex           = "0.4"
# Integration tests synthesise authenticator output so they need the
# same crypto + encoding primitives the real authenticator would use.
base64        = "0.22"
ciborium      = "0.2"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
# `oid` feature so sha2 implements AssociatedOid - needed when the
# x509-cert builder asks for the signature-algorithm identifier.
sha2          = { version = "0.10", features = ["oid"] }
rand          = "0.8"
# Re-enable p256's pkcs8 + pem features in dev builds so SigningKey
# implements SignatureAlgorithmIdentifier (required by x509-cert's
# builder). Cargo merges this with the regular dep's feature set; the
# library never imports anything PEM-related at runtime.
p256          = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
# The {axum,rocket}_server examples wire the crate into a real HTTP
# server so you can register / authenticate a real passkey in your
# browser.
axum          = "0.7"
tokio         = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower-http    = { version = "0.6", features = ["fs", "cors"] }
rocket        = { version = "0.5", features = ["json"] }

# x509-cert with the `builder` feature so attestation tests can mint
# a self-signed P-256 cert at runtime. Used by integration tests
# under tests/.
x509-cert     = { version = "0.2", features = ["builder", "std"] }

# Persistent storage for the axum_sqlite example. `bundled` ships
# the SQLite amalgamation so the example builds on machines that do
# not have sqlite installed system-wide (notably Windows CI).
rusqlite      = { version = "0.32", features = ["bundled"] }

[[example]]
name = "axum_server"
path = "examples/axum_server.rs"

[[example]]
name = "rocket_server"
path = "examples/rocket_server.rs"

[[example]]
name = "axum_passwordless"
path = "examples/axum_passwordless.rs"

[[example]]
name = "rocket_credential_manager"
path = "examples/rocket_credential_manager.rs"

[[example]]
name = "axum_sqlite"
path = "examples/axum_sqlite.rs"
